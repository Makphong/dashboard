<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audit Log</title>
    <link rel="icon" type="image/svg+xml" href="/krung-thai-bank-logo.svg" />
    <link rel="shortcut icon" href="/krung-thai-bank-logo.svg" />
    <link rel="preload" href="/fonts/Krungthai.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="/fonts/Krungthai-Bold.ttf" as="font" type="font/ttf" crossorigin>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
      @font-face {
        font-family: "Krungthai Fast Regular";
        src: url("/fonts/Krungthai.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Krungthai Fast Bold";
        src: url("/fonts/Krungthai-Bold.ttf") format("truetype");
        font-weight: 700;
        font-style: normal;
        font-display: block;
      }
      body {
        --ktb-sky: #00a4e4;
        --ktb-blue: #3860be;
        --ktb-white: #ffffff;
        --ktb-ink: #17335f;
        --ktb-soft: #eef8fd;
        --ktb-line: #d7e8f6;
        font-family: "Krungthai Fast Regular", "Noto Sans Thai", "Segoe UI", Tahoma, Arial, sans-serif;
        background:
          linear-gradient(180deg, rgba(0, 164, 228, 0.045) 0%, rgba(255, 255, 255, 0) 220px),
          #fbfdff;
      }
      .bg-blue-600 { background-color: var(--ktb-sky) !important; }
      .hover\:bg-blue-700:hover { background-color: #078ec7 !important; }
      .text-blue-600 { color: var(--ktb-sky) !important; }
      .text-blue-700 { color: var(--ktb-blue) !important; }
      .text-blue-500 { color: var(--ktb-sky) !important; }
      .text-blue-400 { color: rgba(0, 164, 228, 0.72) !important; }
      .bg-blue-50 { background-color: rgba(0, 164, 228, 0.09) !important; }
      .hover\:bg-blue-50:hover { background-color: rgba(0, 164, 228, 0.10) !important; }
      .border-blue-100 { border-color: rgba(0, 164, 228, 0.22) !important; }
      .border-blue-200 { border-color: rgba(0, 164, 228, 0.36) !important; }
      .border-blue-300 { border-color: rgba(0, 164, 228, 0.48) !important; }
      .hover\:border-blue-200:hover { border-color: rgba(0, 164, 228, 0.36) !important; }
      .hover\:border-blue-300:hover { border-color: rgba(0, 164, 228, 0.48) !important; }
      .focus\:border-blue-500:focus { border-color: var(--ktb-sky) !important; }
      .focus\:ring-blue-500\/20:focus { --tw-ring-color: rgba(0, 164, 228, 0.20) !important; }
      .focus\:ring-blue-100:focus { --tw-ring-color: rgba(0, 164, 228, 0.16) !important; }
      .accent-blue-600 { accent-color: var(--ktb-sky) !important; }
      .from-blue-600 {
        --tw-gradient-from: var(--ktb-sky) var(--tw-gradient-from-position) !important;
        --tw-gradient-to: rgba(0, 164, 228, 0) var(--tw-gradient-to-position) !important;
        --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to) !important;
      }
      .to-indigo-700 { --tw-gradient-to: var(--ktb-blue) var(--tw-gradient-to-position) !important; }
      .from-blue-50 {
        --tw-gradient-from: rgba(0, 164, 228, 0.11) var(--tw-gradient-from-position) !important;
        --tw-gradient-to: rgba(0, 164, 228, 0) var(--tw-gradient-to-position) !important;
        --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to) !important;
      }
      .to-indigo-50 { --tw-gradient-to: rgba(56, 96, 190, 0.10) var(--tw-gradient-to-position) !important; }
      .shadow-ktb {
        box-shadow: 0 10px 24px -22px rgba(56, 96, 190, 0.34), 0 1px 0 rgba(255, 255, 255, 0.72) inset;
      }
      .font-sans,
      svg text,
      svg tspan {
        font-family: "Krungthai Fast Regular", "Noto Sans Thai", "Segoe UI", Tahoma, Arial, sans-serif !important;
      }
      .font-bold,
      .font-extrabold,
      .font-black,
      svg text.font-bold,
      svg text.font-extrabold,
      svg text.font-black,
      svg tspan.font-bold,
      svg tspan.font-extrabold,
      svg tspan.font-black {
        font-family: "Krungthai Fast Bold", "Krungthai Fast Regular", "Noto Sans Thai", "Segoe UI", Tahoma, Arial, sans-serif !important;
        font-weight: 700 !important;
      }
      h1.font-extrabold,
      h2.font-bold,
      h3.font-bold,
      .text-3xl.font-extrabold,
      .text-2xl.font-bold {
        /* Removed stroke and shadow that caused overlapping artifacts */
      }
      * {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        width: 0;
        height: 0;
        display: none;
      }
      .no-scrollbar {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      @keyframes vizOverlayEnter {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes vizPanelEnter {
        from { opacity: 0; transform: translateY(12px) scale(0.985); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      .viz-overlay-enter { animation: vizOverlayEnter 180ms ease-out; }
      .viz-panel-enter { animation: vizPanelEnter 220ms ease-out; }
      @keyframes cardRiseIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .card-rise-in {
        opacity: 0;
        animation: cardRiseIn 420ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      @keyframes confirmOverlayIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes confirmPanelIn {
        0% { opacity: 0; transform: scale(0.85) translateY(20px); }
        60% { opacity: 1; transform: scale(1.03) translateY(-2px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
      }
      @keyframes confirmCheckIn {
        0% { transform: scale(0) rotate(-45deg); opacity: 0; }
        60% { transform: scale(1.2) rotate(5deg); opacity: 1; }
        100% { transform: scale(1) rotate(0deg); opacity: 1; }
      }
      .confirm-overlay-enter { animation: confirmOverlayIn 200ms ease-out; }
      .confirm-panel-enter { animation: confirmPanelIn 380ms cubic-bezier(0.34, 1.56, 0.64, 1); }
      .confirm-check-enter { animation: confirmCheckIn 400ms cubic-bezier(0.34, 1.56, 0.64, 1) 120ms both; }
      @keyframes dropdownSlideIn {
        from { opacity: 0; transform: translateY(-6px) scale(0.97); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      .dropdown-slide-enter { animation: dropdownSlideIn 180ms ease-out; }
      @media (prefers-reduced-motion: reduce) {
        .viz-overlay-enter,
        .viz-panel-enter,
        .card-rise-in,
        .confirm-overlay-enter,
        .confirm-panel-enter,
        .confirm-check-enter,
        .dropdown-slide-enter {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
      @keyframes cardSlideUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-stagger-1 { animation: cardSlideUp 0.5s ease-out forwards; opacity: 0; animation-delay: 0.1s; }
      .animate-stagger-2 { animation: cardSlideUp 0.5s ease-out forwards; opacity: 0; animation-delay: 0.2s; }
      .animate-stagger-3 { animation: cardSlideUp 0.5s ease-out forwards; opacity: 0; animation-delay: 0.3s; }
      .animate-stagger-4 { animation: cardSlideUp 0.5s ease-out forwards; opacity: 0; animation-delay: 0.4s; }
      .animate-stagger-5 { animation: cardSlideUp 0.5s ease-out forwards; opacity: 0; animation-delay: 0.5s; }
      /* Performance Optimizations */
      .animate-in, .transition-all, .transition-transform {
        backface-visibility: hidden;
        perspective: 1000px;
        will-change: transform, opacity;
      }
      .no-scrollbar {
        -webkit-overflow-scrolling: touch; /* Smooth momentum scrolling on iOS */
      }
      /* Reduce layout thrashing */
      main {
        contain: content;
      }
      .shadow-ktb {
        /* Optimize shadow performance */
        will-change: transform;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react-dom": "https://esm.sh/react-dom@18.3.1",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
          "lucide-react": "https://esm.sh/lucide-react@0.469.0?external=react",
          "recharts": "https://esm.sh/recharts@2.15.0?external=react,react-dom"
        }
      }
    </script>
  </head>
  <body class="bg-[#fbfdff]">
    <div id="root">
      <div class="h-screen w-screen bg-[#fbfdff] flex items-center justify-center">
        <div class="text-center">
          <div class="mx-auto mb-3 h-9 w-9 rounded-full border-4 border-slate-200 border-t-[#00a4e4] animate-spin"></div>
          <p class="text-sm font-semibold text-slate-600">Loading dashboard...</p>
        </div>
      </div>
    </div>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="module">
      const frontendBuildVersion = '20260601-cloud-sync-supabase-1';
      const moduleCache = new Map();
      const relativeImportPattern = /(import\s+(?:[^'"]*?\s+from\s+)?|export\s+[^'"]*?\s+from\s+)(['"])(\.[^'"]+)\2/g;

      function withBuildVersion(url) {
        const parsedUrl = new URL(url, window.location.href);
        if (parsedUrl.origin === window.location.origin && parsedUrl.pathname.includes('/frontend/src/')) {
          parsedUrl.searchParams.set('v', frontendBuildVersion);
        }
        return parsedUrl.href;
      }

      async function loadJsxModule(url) {
        const normalizedUrl = withBuildVersion(url);
        if (moduleCache.has(normalizedUrl)) return moduleCache.get(normalizedUrl);

        const modulePromise = (async () => {
          const response = await fetch(normalizedUrl);
          if (!response.ok) throw new Error(`Failed to load module ${normalizedUrl}: ${response.status}`);

          let source = await response.text();
          const dependencies = [];
          source.replace(relativeImportPattern, (match, prefix, quote, specifier) => {
            dependencies.push({
              match,
              replacementPrefix: prefix,
              quote,
              specifier,
              url: withBuildVersion(new URL(specifier, normalizedUrl)),
            });
            return match;
          });

          for (const dependency of dependencies) {
            const dependencyBlobUrl = await loadJsxModule(dependency.url);
            source = source.replace(
              dependency.match,
              `${dependency.replacementPrefix}${dependency.quote}${dependencyBlobUrl}${dependency.quote}`
            );
          }

          const transformed = Babel.transform(source, {
            presets: ['react'],
            sourceType: 'module',
            filename: normalizedUrl,
          }).code;
          return URL.createObjectURL(new Blob([transformed], { type: 'text/javascript' }));
        })();

        moduleCache.set(normalizedUrl, modulePromise);
        return modulePromise;
      }

      loadJsxModule(new URL('/frontend/src/app.jsx', window.location.href))
        .then((entryUrl) => import(entryUrl))
        .catch((error) => {
          console.error(error);
          document.getElementById('root').innerHTML = `
            <div class="min-h-screen bg-slate-50 p-8 text-slate-900">
              <div class="mx-auto max-w-2xl rounded-2xl border border-red-200 bg-white p-6 shadow-sm">
                <h1 class="text-xl font-bold text-red-700">Frontend failed to load</h1>
                <p class="mt-2 text-sm text-slate-600">${error.message}</p>
              </div>
            </div>
          `;
        });
    </script>
  </body>
</html>
